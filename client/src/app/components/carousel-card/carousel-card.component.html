<!--resource.category is "artist" or "album", which matches the routes in app-routing.module.ts.-->
<a [href]="'/' + resource.category + '/' + resource.id">
	<img class="d-block w-100" [src]="resource.imageURL" [alt]="resource.name">
	<div class="carousel-caption d-none d-md-block">
		<h5>{{resource.name}}</h5>
	</div>
</a>
