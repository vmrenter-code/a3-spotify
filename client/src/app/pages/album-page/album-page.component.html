@if(album) {
	<div class="row">
		<div class="col-12 col-sm-6">
			<h1>{{album.name}}</h1>
			<img id="albumImg" [src]="album.imageURL" [alt]="album.name">
			<app-thermometer [popularity]="album.popularity"></app-thermometer>
			<!--An album can have several artists (e.g. features), so list each one with a link to its artist page.-->
			@for(artist of album.artists; track artist.id) {
				<p>
					Artist: <a [href]="'/artist/' + artist.id">{{artist.name}}</a>
				</p>
			}
			<p>
				<!--The one link on this page that leaves the app and goes to Spotify.com.-->
				<a class="btn btn-light" role="button" target="_blank" [href]="album.url">Open {{album.name}} on Spotify</a>
			</p>
		</div>
		<div class="col-12 col-sm-6">
			<h3>Album Tracks</h3>
			<!--Every track is on this album, and the artists are listed on the left, so both columns would be redundant.-->
			<app-track-list [tracks]="tracks" [hideArtist]="true" [hideAlbum]="true"></app-track-list>
		</div>
	</div>
}
