@if(artist) {
	<div class="row">
		<div class="col-xl-4 col-12">
			<h1>{{artist.name}}</h1>
			<img id="artistImg" [src]="artist.imageURL" [alt]="artist.name">
			<p>
				<!--The one link on this page that leaves the app and goes to Spotify.com.-->
				<a class="btn btn-light" role="button" target="_blank" [href]="artist.url">Open {{artist.name}} on Spotify</a>
			</p>
		</div>
		<div class="col-xl-4 col-12">
			<h3>Popularity</h3>
			<!--followersStr uses toLocaleString(), which adds the commas.-->
			<p>{{artist.followersStr}} followers</p>
			<app-thermometer [popularity]="artist.popularity"></app-thermometer>
			<h3>{{artist.name}}'s Albums</h3>
			<app-carousel carouselId="artistAlbums" [resources]="albums"></app-carousel>
		</div>
		<div class="col-xl-4 col-12">
			<h3>{{artist.name}}'s Top Tracks</h3>
			<!--Every top track is by this artist, so the artist column would repeat the same name.-->
			<app-track-list [tracks]="topTracks" [hideArtist]="true"></app-track-list>
		</div>
	</div>
}
