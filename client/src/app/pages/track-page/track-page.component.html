<div class="row">
	@if(track) {
		<div class="col-sm-6 col-12">
			<h1>{{track.name}}</h1>
			<!--Guard in case a track comes back without its album.-->
			@if(track.album) {
				<p>
					Track on <a [href]="'/album/' + track.album.id">{{track.album.name}}</a>
				</p>
			}
			<div>
				<!--A track can have several artists (e.g. features), so list each one with a link to its artist page.-->
				@for(artist of track.artists; track artist.id) {
					<p>
						Artist: <a [href]="'/artist/' + artist.id">{{artist.name}}</a>
					</p>
				}
			</div>
			<p>
				<!--durationStr converts duration_ms into M:SS form.-->
				Duration: {{track.durationStr}}
			</p>
			<p>
				<!--The one link on this page that leaves the app and goes to Spotify.com.-->
				<a class="btn btn-light" role="button" target="_blank" [href]="track.url">Open {{track.name}} on Spotify</a>
			</p>
		</div>
		<div class="col-sm-6 col-12">
			<app-thermometer [popularity]="track.popularity"></app-thermometer>
		</div>
	}
</div>
